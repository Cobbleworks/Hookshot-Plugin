# Hookshot Plugin Configuration

# ===== DEFAULT VALUES =====
# These are the default values for new players

# Default range for the grappling hook (in blocks)
default-range: 30.0

# Speed at which the player is pulled to the hook location
# Higher values = faster pull
pull-speed: 2.0

# Vertical boost to help player get over obstacles
# Higher values = more upward momentum
vertical-boost: 0.3

# Multiplier for the fishing hook velocity (how fast the hook is thrown)
# Higher values = hook travels further/faster
hook-velocity-multiplier: 2.0

# Play sound when hook pulls player
play-sound: true

# Show particle effects when hook pulls player
show-particles: true

# ===== SETTING LIMITS =====
# Min/Max values that players can configure

# Range limits (in blocks)
min-range: 10.0
max-range: 100.0

# Pull speed limits
min-pull-speed: 0.5
max-pull-speed: 5.0

# Vertical boost limits
min-vertical-boost: 0.0
max-vertical-boost: 1.5

# Hook velocity limits (throw speed)
min-hook-velocity: 1.0
max-hook-velocity: 5.0
