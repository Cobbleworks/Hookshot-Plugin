name: Hookshot
version: ${project.version}
main: com.hookshot.HookshotPlugin
api-version: 1.19
author: Cobbleworks
website: https://github.com/Cobbleworks/Hookshot-Plugin
description: Transform your fishing rod into a grappling hook!

commands:
  hookshot:
    description: Manage your grappling hook settings
    usage: /hookshot [toggle|range|speed|boost|velocity|sound|particles|reset|info]
    aliases: [hook, grapple]

permissions:
  hookshot.use:
    description: Allow player to use the grappling hook
    default: true
  hookshot.settings:
    description: Allow player to configure their hookshot settings
    default: true
  hookshot.admin:
    description: Administrative access to hookshot features
    default: op
