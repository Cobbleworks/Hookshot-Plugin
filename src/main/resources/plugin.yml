name: Hookshot
version: 1.0.0
main: com.hookshot.HookshotPlugin
api-version: 1.19
author: YourName
description: Transform your fishing rod into a grappling hook!

commands:
  hookshot:
    description: Toggle the grappling hook feature
    usage: /hookshot [toggle|range <value>|info]
    aliases: [hook, grapple]

permissions:
  hookshot.use:
    description: Allow player to use the grappling hook
    default: true
  hookshot.range:
    description: Allow player to configure their hook range
    default: true
  hookshot.admin:
    description: Administrative access to hookshot features
    default: op
