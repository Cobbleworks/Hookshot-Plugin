name: Hookshot
version: ${project.version}
main: com.hookshot.HookshotPlugin
api-version: '26.2'
author: Cobbleworks
website: https://github.com/Cobbleworks/Hookshot-Plugin
description: A wearable grapple harness with rope-swing physics.

commands:
  hookshot:
    description: Grapple harness help and administration
    usage: /hookshot [help|give|reload]
    aliases: [hook, grapple]

permissions:
  hookshot.use:
    description: Allows using a worn grapple harness
    default: true
  hookshot.give:
    description: Allows giving grapple harnesses with /hookshot give
    default: op
  hookshot.reload:
    description: Allows reloading the configuration with /hookshot reload
    default: op
  hookshot.admin:
    description: All administrative Hookshot permissions
    default: op
    children:
      hookshot.give: true
      hookshot.reload: true
